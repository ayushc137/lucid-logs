<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Offline - Lucid Logs</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				font-family: ui-sans-serif, system-ui, sans-serif;
				background: #0f0f12;
				color: #e5e5e8;
				text-align: center;
				padding: 1.5rem;
			}
			.emoji { font-size: 3rem; }
			h1 { font-size: 1.4rem; margin: 0; font-weight: 700; }
			p { color: #9a9aa3; margin: 0; max-width: 32ch; line-height: 1.5; }
			button {
				margin-top: 0.75rem;
				padding: 0.6rem 1.4rem;
				border: none;
				border-radius: 0.75rem;
				background: #8b5cf6;
				color: white;
				font-weight: 600;
				font-size: 0.95rem;
				cursor: pointer;
			}
			button:hover { background: #7c4dff; }
		</style>
	</head>
	<body>
		<div class="emoji">📓</div>
		<h1>You're offline</h1>
		<p>Lucid Logs needs a connection to load your timeline. Check your network and try again.</p>
		<button onclick="location.reload()">Retry</button>
	</body>
</html>
