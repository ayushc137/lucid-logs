# Air - Live reload for Go apps
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # Build command:
  # 1. Run DB migrations (idempotent, quiet) - uses same ns/db as Go app
  # 2. Regenerate swagger docs
  # 3. Build the Go binary
  cmd = "cat ../../db/migrations/*.surql 2>/dev/null | surreal sql --endpoint http://localhost:8000 --username root --password root --namespace daily_journal --database core --hide-welcome >/dev/null 2>&1; swag init -g cmd/api/main.go -o docs/swagger --quiet 2>/dev/null; go build -o ./tmp/main ./cmd/api"
  # Binary file output
  bin = "./tmp/main"
  # Watch these directories (including db migrations)
  include_dir = ["cmd", "internal", "pkg", "../../db/migrations"]
  # Watch these extensions
  include_ext = ["go", "tpl", "tmpl", "html", "surql"]
  # Exclude directories
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs"]
  # Exclude files
  exclude_file = []
  # Exclude regex patterns
  exclude_regex = ["_test.go"]
  # Exclude unchanged files
  exclude_unchanged = true
  # Follow symlinks
  follow_symlink = false
  # Log file
  log = "build-errors.log"
  # Poll interval (ms) - set to 0 for fsnotify
  poll = false
  poll_interval = 0
  # Delay before rebuild (ms)
  delay = 1000
  # Stop old binary before building
  stop_on_error = true
  # Send interrupt signal
  send_interrupt = false
  # Kill delay after interrupt
  kill_delay = "2s"
  # Rerun with arguments
  rerun = false
  rerun_delay = 500
  # Arguments to pass
  args_bin = []

[log]
  # Show log time
  time = false
  # Main log only
  main_only = false

[color]
  # Customize colors
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Clean on exit
  clean_on_exit = true

