basePath: /
definitions:
  analytics.CategoryBreakdown:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      hours:
        type: number
      percentage:
        type: number
      task_count:
        type: integer
    type: object
  analytics.CategoryMetrics:
    description: Category time distribution metrics
    properties:
      distribution:
        items:
          $ref: '#/definitions/analytics.CategoryBreakdown'
        type: array
      life_domain_distribution:
        items:
          $ref: '#/definitions/analytics.LifeDomainBreakdown'
        type: array
      neglected_areas:
        items:
          $ref: '#/definitions/analytics.NeglectedCategory'
        type: array
      total_hours:
        type: number
    type: object
  analytics.ChartMeta:
    properties:
      computed_at:
        type: string
      data_points:
        type: integer
      end_date:
        type: string
      period:
        type: string
      start_date:
        type: string
    type: object
  analytics.ChartRequest:
    description: Generic request for generating chart data
    properties:
      chart_type:
        enum:
        - time_series
        - pie
        - bar
        - heatmap
        - radar
        - scatter
        - gauge
        example: time_series
        type: string
      end_date:
        example: "2025-12-14T23:59:59Z"
        type: string
      filters:
        $ref: '#/definitions/analytics.Filters'
      group_by:
        description: '"hour", "day", "week", "month", "category", "quadrant"'
        example: day
        type: string
      metric:
        example: mood
        type: string
      period:
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        example: week
        type: string
      start_date:
        example: "2025-12-01T00:00:00Z"
        type: string
    required:
    - chart_type
    - metric
    - period
    type: object
  analytics.ChartResponse:
    description: Generic chart data response
    properties:
      chart_type:
        type: string
      data:
        description: Shape varies by chart_type
      meta:
        $ref: '#/definitions/analytics.ChartMeta'
      metric:
        type: string
    type: object
  analytics.DailyMood:
    properties:
      arousal:
        type: number
      date:
        type: string
      quadrant:
        type: string
      valence:
        type: number
    type: object
  analytics.DashboardResponse:
    description: Combined dashboard metrics
    properties:
      categories:
        $ref: '#/definitions/analytics.CategoryMetrics'
      emotions:
        $ref: '#/definitions/analytics.EmotionMetrics'
      goals:
        $ref: '#/definitions/analytics.GoalMetrics'
      period:
        type: string
      tasks:
        $ref: '#/definitions/analytics.TaskMetrics'
    type: object
  analytics.EmotionCount:
    properties:
      count:
        type: integer
      emotion_id:
        type: string
      emotion_name:
        type: string
      quadrant:
        type: string
    type: object
  analytics.EmotionMetrics:
    description: Emotion and mood metrics with 6D vector analysis
    properties:
      average_arousal:
        description: -1 to +1
        type: number
      average_valence:
        description: -1 to +1
        type: number
      dominant_quadrant:
        description: yellow/green/red/blue
        type: string
      emotion_counts:
        additionalProperties:
          type: integer
        description: Emotion name -> count
        type: object
      mood_stability:
        description: 0 to 1 (1 = stable)
        type: number
      quadrant_distribution:
        $ref: '#/definitions/analytics.QuadrantDist'
      top_emotions:
        items:
          $ref: '#/definitions/analytics.EmotionCount'
        type: array
      trend:
        description: Daily mood over time
        items:
          $ref: '#/definitions/analytics.DailyMood'
        type: array
    type: object
  analytics.Filters:
    properties:
      category_ids:
        items:
          type: string
        type: array
      goal_ids:
        items:
          type: string
        type: array
      life_domain:
        items:
          type: string
        type: array
      quadrants:
        description: '"yellow", "green", "red", "blue"'
        items:
          type: string
        type: array
      task_status:
        items:
          type: string
        type: array
    type: object
  analytics.GoalMetrics:
    description: Goal and streak metrics
    properties:
      active_goals:
        type: integer
      avg_progress:
        description: Average % progress
        type: number
      completed_goals:
        type: integer
      goal_progress:
        items:
          $ref: '#/definitions/analytics.GoalProgress'
        type: array
      streak_leaders:
        description: Top streaks
        items:
          $ref: '#/definitions/analytics.StreakInfo'
        type: array
      total_streak_days:
        description: Sum of all current streaks
        type: integer
    type: object
  analytics.GoalProgress:
    properties:
      current_value:
        type: number
      goal_id:
        type: string
      goal_title:
        type: string
      goal_type:
        type: string
      progress:
        description: 0-100%
        type: number
      status:
        type: string
      target_value:
        type: number
    type: object
  analytics.LifeDomainBreakdown:
    properties:
      domain:
        type: string
      hours:
        type: number
      percentage:
        type: number
    type: object
  analytics.NeglectedCategory:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      days_since_active:
        type: integer
    type: object
  analytics.QuadrantDist:
    properties:
      blue:
        description: Low energy, unpleasant
        type: number
      green:
        description: Low energy, pleasant
        type: number
      red:
        description: High energy, unpleasant
        type: number
      yellow:
        description: High energy, pleasant
        type: number
    type: object
  analytics.StreakInfo:
    properties:
      current_streak:
        type: integer
      goal_id:
        type: string
      goal_title:
        type: string
      longest_streak:
        type: integer
    type: object
  analytics.TaskMetrics:
    description: Task productivity metrics
    properties:
      abandoned_tasks:
        type: integer
      avg_task_duration_minutes:
        type: number
      by_category:
        items:
          $ref: '#/definitions/analytics.CategoryBreakdown'
        type: array
      completed_tasks:
        type: integer
      completion_rate:
        description: '% of tasks completed'
        type: number
      peak_hours:
        description: Most productive hours
        items:
          type: integer
        type: array
      postponed_tasks:
        type: integer
      total_duration_hours:
        type: number
      total_tasks:
        type: integer
      velocity:
        description: Tasks per day
        type: number
    type: object
  auth.AuthResponse:
    description: Authentication response with JWT token
    properties:
      is_admin:
        example: false
        type: boolean
      token:
        example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        example: user:abc123
        type: string
    type: object
  auth.LoginRequest:
    description: Login request payload
    properties:
      password:
        example: adminadmin
        minLength: 6
        type: string
      username:
        example: admin@example.com
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterRequest:
    description: Registration request payload
    properties:
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: user@example.com
        type: string
    required:
    - password
    - username
    type: object
  categories.Category:
    properties:
      color:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  categories.CategoryPageResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/categories.Category'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  categories.CreateRequest:
    description: Request payload for creating a category
    properties:
      color:
        example: '#3B82F6'
        maxLength: 20
        minLength: 4
        type: string
      name:
        example: Work
        maxLength: 40
        minLength: 1
        type: string
    required:
    - color
    - name
    type: object
  categories.UpdateRequest:
    description: Request payload for updating a category
    properties:
      color:
        example: '#10B981'
        maxLength: 20
        minLength: 4
        type: string
      name:
        example: Personal
        maxLength: 40
        minLength: 1
        type: string
    type: object
  emotions.Emotion:
    properties:
      arousal:
        description: '-1 to +1: high/low energy'
        type: number
      certainty:
        description: '-1 to +1: sure/unsure'
        type: number
      description:
        type: string
      dominance:
        description: '-1 to +1: in control/controlled'
        type: number
      emoji:
        type: string
      id:
        description: e.g., "emotions:E16"
        type: string
      intensity:
        description: '0.1 to 1.0: default weight'
        type: number
      name:
        type: string
      quadrant:
        type: string
      social:
        description: '-1 to +1: social/individual'
        type: number
      valence:
        description: '-1 to +1: pleasant/unpleasant'
        type: number
      x:
        type: integer
      "y":
        type: integer
    type: object
  emotions.EmotionDetail:
    properties:
      arousal:
        type: number
      certainty:
        type: number
      description:
        type: string
      dominance:
        type: number
      emoji:
        type: string
      id:
        description: e.g., "emotions:E16"
        type: string
      intensity:
        type: number
      name:
        type: string
      quadrant:
        type: string
      social:
        type: number
      valence:
        type: number
      x:
        type: integer
      "y":
        type: integer
    type: object
  emotions.GridResponse:
    properties:
      blue:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
      green:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
      red:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
      total:
        type: integer
      yellow:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
    type: object
  emotions.InferRequest:
    properties:
      negatives:
        items:
          $ref: '#/definitions/emotions.TaskItem'
        type: array
      positives:
        items:
          $ref: '#/definitions/emotions.TaskItem'
        type: array
    type: object
  emotions.InferResponse:
    properties:
      closest_emotion:
        $ref: '#/definitions/emotions.EmotionDetail'
      inferred_emotion:
        $ref: '#/definitions/emotions.InferredEmotion'
    type: object
  emotions.InferredEmotion:
    properties:
      arousal:
        description: -1 to +1
        type: number
      closest_emotion_id:
        description: Nearest emotion
        type: string
      dissonance:
        description: '0-1: internal conflict score'
        type: number
      dominance:
        description: -1 to +1
        type: number
      negative_count:
        description: Number of negative items with emotions
        type: integer
      positive_count:
        description: Metadata
        type: integer
      quadrant:
        description: Classification
        type: string
      valence:
        description: Weighted centroid coordinates
        type: number
    type: object
  emotions.TaskItem:
    properties:
      emotion_id:
        description: 'Optional: e.g., "emotions:E16"'
        type: string
      text:
        type: string
    type: object
  errors.ErrorCode:
    enum:
    - BAD_REQUEST
    - VALIDATION_FAILED
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - CONFLICT
    - TOO_MANY_REQUESTS
    - INTERNAL_ERROR
    - DATABASE_ERROR
    - SERVICE_UNAVAILABLE
    type: string
    x-enum-varnames:
    - CodeBadRequest
    - CodeValidationFailed
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeTooManyRequests
    - CodeInternalError
    - CodeDatabaseError
    - CodeServiceError
  goalactions.ActionListResponse:
    properties:
      actions:
        items:
          $ref: '#/definitions/goalactions.GoalAction'
        type: array
      count:
        type: integer
      goal_id:
        type: string
    type: object
  goalactions.CreateRequest:
    description: Request payload for creating a goal action
    properties:
      description:
        example: Finish all lessons in Module 1 including exercises
        maxLength: 2000
        type: string
      order:
        example: 1
        type: integer
      quantity_unit:
        example: km
        maxLength: 50
        type: string
      quantity_value:
        example: 5
        type: number
      title:
        example: Complete Python Basics course
        maxLength: 500
        minLength: 1
        type: string
    required:
    - title
    type: object
  goalactions.GoalAction:
    properties:
      completed:
        description: Completion status (for discrete goals only)
        type: boolean
      completed_at:
        type: string
      created_at:
        description: Metadata
        type: string
      deleted_at:
        type: string
      description:
        type: string
      goal_id:
        description: Parent goal ID
        type: string
      id:
        description: '"goal_actions:abc123"'
        type: string
      order:
        description: Display order
        type: integer
      quantity_unit:
        description: e.g., "km"
        type: string
      quantity_value:
        description: Quantity (for measurable contributions)
        type: number
      title:
        description: Action definition
        type: string
      updated_at:
        type: string
    type: object
  goalactions.ReorderRequest:
    description: Request payload for reordering goal actions
    properties:
      action_ids:
        description: Ordered list of action IDs
        items:
          type: string
        minItems: 1
        type: array
    required:
    - action_ids
    type: object
  goalactions.UpdateRequest:
    description: Request payload for updating a goal action
    properties:
      completed:
        description: Set completion status
        example: true
        type: boolean
      description:
        example: Updated description
        maxLength: 2000
        type: string
      order:
        example: 2
        type: integer
      quantity_unit:
        example: pages
        maxLength: 50
        type: string
      quantity_value:
        example: 10
        type: number
      title:
        example: Complete Advanced Python
        maxLength: 500
        minLength: 1
        type: string
    type: object
  goalentries.CreateRequest:
    description: Request payload for creating a goal entry
    properties:
      date:
        example: "2025-12-13"
        type: string
      met:
        example: true
        type: boolean
      notes:
        maxLength: 1000
        type: string
      task_ids:
        items:
          type: string
        type: array
      value:
        example: 1.5
        type: number
    required:
    - date
    type: object
  goalentries.EntrySummary:
    properties:
      met_days:
        type: integer
      missed_days:
        type: integer
      success_rate:
        description: met / total * 100
        type: number
      total_days:
        type: integer
      total_value:
        type: number
    type: object
  goalentries.GoalEntry:
    properties:
      created_at:
        description: Metadata
        type: string
      date:
        description: The date this entry is for (YYYY-MM-DD, time component ignored)
        type: string
      goal_id:
        type: string
      id:
        type: string
      met:
        description: Was the target met for this period?
        type: boolean
      notes:
        description: Optional notes
        type: string
      task_ids:
        description: Task IDs that contributed to this entry
        items:
          type: string
        type: array
      updated_at:
        type: string
      value:
        description: Actual value achieved (for measurable goals)
        type: number
    type: object
  goalentries.GoalEntryListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/goalentries.GoalEntry'
        type: array
      goal_id:
        type: string
      summary:
        $ref: '#/definitions/goalentries.EntrySummary'
    type: object
  goals.CreateRequest:
    description: Request payload for creating a goal
    properties:
      category_id:
        example: categories:health123
        type: string
      color:
        example: '#3B82F6'
        maxLength: 20
        type: string
      completion_mode:
        enum:
        - all
        - any
        example: all
        type: string
      deadline:
        example: "2025-12-31T23:59:59Z"
        type: string
      description:
        example: Stay hydrated throughout the day for better health and focus
        maxLength: 2000
        type: string
      goal_type:
        enum:
        - discrete
        - measurable
        - epic
        - avoidance
        example: measurable
        type: string
      icon:
        example: "\U0001F4A7"
        maxLength: 50
        type: string
      is_private:
        example: false
        type: boolean
      life_domain:
        example: health
        maxLength: 50
        type: string
      parent_goal:
        example: goals:epic456
        type: string
      priority:
        example: 2
        maximum: 3
        minimum: 0
        type: integer
      recurrence:
        $ref: '#/definitions/goals.RecurrenceInput'
      start_date:
        example: "2025-01-01T00:00:00Z"
        type: string
      target:
        $ref: '#/definitions/goals.TargetInput'
      title:
        example: Drink 3L water daily
        maxLength: 500
        minLength: 1
        type: string
      value_score:
        example: 4
        maximum: 5
        minimum: 0
        type: integer
      why:
        example: Improve energy levels and skin health
        maxLength: 1000
        type: string
    required:
    - goal_type
    - title
    type: object
  goals.Goal:
    properties:
      activity_key:
        description: Auto-generated unique key for matching
        type: string
      category:
        $ref: '#/definitions/categories.Category'
      child_goals:
        description: Child goals (populated for epic goals)
        items:
          $ref: '#/definitions/goals.Goal'
        type: array
      color:
        type: string
      completion_date:
        type: string
      completion_mode:
        description: Completion settings (for epic goals)
        type: string
      created_at:
        description: Metadata
        type: string
      current_streak:
        description: Streak tracking (computed, for recurring goals)
        type: integer
      deadline:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      goal_type:
        description: Goal type
        type: string
      grace_days_used:
        type: integer
      icon:
        type: string
      id:
        type: string
      is_private:
        description: Privacy
        type: boolean
      last_completed_date:
        type: string
      life_domain:
        description: health, work, learning, etc.
        type: string
      linked_tasks:
        description: Linked tasks (populated via FETCH)
        items:
          $ref: '#/definitions/goals.GoalTaskLink'
        type: array
      linked_template:
        description: Linked template (auto-created)
        type: string
      longest_streak:
        type: integer
      parent_goal:
        description: For milestones under epics
        type: string
      priority:
        description: Organization
        type: integer
      recurrence:
        allOf:
        - $ref: '#/definitions/goals.Recurrence'
        description: Recurrence (null = one-time, populated = recurring/habit)
      start_date:
        description: Timeline
        type: string
      status:
        description: Status & progress
        type: string
      target:
        allOf:
        - $ref: '#/definitions/goals.Target'
        description: Target (for measurable goals)
      title:
        description: Core fields
        type: string
      updated_at:
        type: string
      value_score:
        description: 1-5, how meaningful
        type: integer
      why:
        description: '"Why does this matter?" - for retros'
        type: string
    type: object
  goals.GoalPageResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/goals.Goal'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  goals.GoalTaskLink:
    properties:
      impact_magnitude:
        description: 1-5
        type: integer
      impact_type:
        description: '"positive", "negative", "neutral"'
        type: string
      quantity_unit:
        type: string
      quantity_value:
        type: number
      task_id:
        type: string
      task_title:
        type: string
    type: object
  goals.Recurrence:
    properties:
      active_days:
        description: '["mon", "tue", ...] or nil for all'
        items:
          type: string
        type: array
      after_time:
        description: '"06:00" (complete after 6am)'
        type: string
      before_time:
        description: Time constraints
        type: string
      frequency:
        description: Times per period (e.g., 5)
        type: integer
      grace_days:
        description: Streak settings
        type: integer
      period:
        description: '"day", "week", "month"'
        type: string
    type: object
  goals.RecurrenceInput:
    properties:
      active_days:
        items:
          type: string
        type: array
      after_time:
        example: "06:00"
        type: string
      before_time:
        example: "22:00"
        type: string
      frequency:
        example: 1
        maximum: 365
        minimum: 1
        type: integer
      grace_days:
        example: 1
        maximum: 7
        minimum: 0
        type: integer
      period:
        enum:
        - day
        - week
        - month
        example: day
        type: string
    required:
    - frequency
    - period
    type: object
  goals.Target:
    properties:
      current_value:
        description: Auto-computed from linked tasks
        type: number
      per_period:
        description: true = "3L per day", false = "1000km total"
        type: boolean
      unit:
        description: '"km", "L", "pages", "minutes"'
        type: string
      value:
        description: e.g., 1000, 3
        type: number
    type: object
  goals.TargetInput:
    properties:
      per_period:
        example: true
        type: boolean
      unit:
        example: liters
        maxLength: 50
        minLength: 1
        type: string
      value:
        example: 3
        type: number
    required:
    - unit
    - value
    type: object
  goals.TodayGoal:
    properties:
      goal:
        $ref: '#/definitions/goals.Goal'
      streak:
        type: integer
      today_met:
        type: boolean
      today_value:
        type: number
    type: object
  goals.TodayGoalsResponse:
    properties:
      date:
        description: YYYY-MM-DD
        type: string
      goals:
        items:
          $ref: '#/definitions/goals.TodayGoal'
        type: array
    type: object
  goals.UpdateRequest:
    description: Request payload for updating a goal
    properties:
      category_id:
        type: string
      color:
        maxLength: 20
        type: string
      completion_mode:
        enum:
        - all
        - any
        type: string
      deadline:
        type: string
      description:
        maxLength: 2000
        type: string
      goal_type:
        enum:
        - discrete
        - measurable
        - epic
        - avoidance
        type: string
      icon:
        maxLength: 50
        type: string
      is_private:
        type: boolean
      life_domain:
        maxLength: 50
        type: string
      priority:
        maximum: 3
        minimum: 0
        type: integer
      recurrence:
        $ref: '#/definitions/goals.RecurrenceInput'
      start_date:
        type: string
      status:
        enum:
        - active
        - completed
        - paused
        - abandoned
        type: string
      target:
        $ref: '#/definitions/goals.TargetInput'
      title:
        maxLength: 500
        minLength: 1
        type: string
      value_score:
        maximum: 5
        minimum: 0
