info:
  contact: {}
  description: Daily journal backend powered by SurrealDB.
  title: Lucid Logs API
  version: "1.0"
paths:
  /api/v1/analytics/charts:
    post:
      consumes:
      - application/json
      description: Generates chart data based on flexible configuration
      parameters:
      - description: Chart configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/analytics.ChartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.ChartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Generate chart data
      tags:
      - Analytics
  /api/v1/analytics/dashboard:
    get:
      description: Retrieves combined dashboard metrics for tasks, emotions, goals,
        categories
      parameters:
      - default: week
        description: Time period (day, week, month, quarter, year)
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.DashboardResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get dashboard metrics
      tags:
      - Analytics
  /api/v1/analytics/metrics/categories:
    get:
      description: Retrieves time spent per category with percentages
      parameters:
      - default: week
        description: Time period (day, week, month, quarter, year)
        in: query
        name: period
        type: string
      - description: Start date for custom period (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date for custom period (RFC3339)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.CategoryMetrics'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get category time distribution
      tags:
      - Analytics
  /api/v1/analytics/metrics/emotions:
    get:
      description: Retrieves valence, arousal, mood stability, quadrant distribution,
        top emotions
      parameters:
      - default: week
        description: Time period (day, week, month, quarter, year)
        in: query
        name: period
        type: string
      - description: Start date for custom period (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date for custom period (RFC3339)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.EmotionMetrics'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get emotion/mood metrics
      tags:
      - Analytics
  /api/v1/analytics/metrics/goals:
    get:
      description: Retrieves goal progress, streaks, and completion stats
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.GoalMetrics'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get goal progress metrics
      tags:
      - Analytics
  /api/v1/analytics/metrics/tasks:
    get:
      description: Retrieves task completion rate, velocity, peak hours, category
        breakdown
      parameters:
      - default: week
        description: Time period (day, week, month, quarter, year)
        in: query
        name: period
        type: string
      - description: Start date for custom period (RFC3339)
        in: query
        name: start_date
        type: string
      - description: End date for custom period (RFC3339)
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analytics.TaskMetrics'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      security:
      - BearerAuth: []
      summary: Get task productivity metrics
      tags:
      - Analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Invalid credentials
          schema:
