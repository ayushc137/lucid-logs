  units.CreateRequest:
    description: Request payload for creating a custom unit
    properties:
      name:
        example: pomodoros
        maxLength: 50
        minLength: 1
        type: string
      symbol:
        example: "\U0001F345"
        maxLength: 10
        minLength: 1
        type: string
      type:
        enum:
        - distance
        - time
        - volume
        - count
        - custom
        example: custom
        type: string
    required:
    - name
    - symbol
    type: object
  units.Unit:
    description: Unit of measurement for tracking quantities
    properties:
      created_at:
        description: Metadata
        type: string
      id:
        description: units:km, units:hr, etc.
        type: string
      is_system:
        description: System flag
        type: boolean
      name:
        description: Core fields
        type: string
      symbol:
        description: '"km", "hr", "L"'
        type: string
      type:
        description: '"distance", "time", "volume", "count", "custom"'
        type: string
      updated_at:
        type: string
    type: object
  units.UnitListResponse:
    description: List of available units
    properties:
      items:
        items:
          $ref: '#/definitions/units.Unit'
        type: array
      system_only:
        description: If filtered to system units only
        type: boolean
    type: object
  units.UpdateRequest:
    description: Request payload for updating a custom unit
    properties:
      name:
        example: focus sessions
        maxLength: 50
        minLength: 1
        type: string
      symbol:
        example: ⏱️
        maxLength: 10
        minLength: 1
        type: string
    type: object
