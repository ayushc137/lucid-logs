    type: object
  tasks.UpdateRequest:
    description: Request payload for updating a task
    properties:
      completed:
        type: boolean
      emotion_id:
        type: string
      end_date:
        type: string
      goal_links:
        items:
          $ref: '#/definitions/tasks.GoalLinkInput'
        type: array
      journal:
        maxLength: 10000
        type: string
      negatives:
        items:
          $ref: '#/definitions/tasks.TaskItem'
        type: array
      note:
        maxLength: 5000
        type: string
      positives:
        items:
          $ref: '#/definitions/tasks.TaskItem'
        type: array
      quantity:
        $ref: '#/definitions/tasks.QuantityInput'
      start_date:
        type: string
      title:
        maxLength: 500
        minLength: 1
        type: string
