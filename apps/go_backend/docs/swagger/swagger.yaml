basePath: /
definitions:
  activities.Activity:
    description: Reusable task blueprint for quick logging
    properties:
      active_session:
        allOf:
        - $ref: '#/definitions/activities.TimerSession'
        description: Active Timer Session (if any)
      category:
        allOf:
        - $ref: '#/definitions/categories.Category'
        description: From in_category edge
      created_at:
        description: Metadata
        type: string
      default_completed:
        description: true = instant log creates completed task
        type: boolean
      default_duration:
        description: Task Defaults (pre-fill when creating task)
        type: integer
      default_emotion_id:
        description: emotions:xxx
        type: string
      default_impact:
        description: Goal Link Defaults
        type: string
      default_priority:
        description: 1-5
        type: integer
      deleted_at:
        type: string
      description:
        description: Template for task journal
        type: string
      goals:
        description: Populated via graph queries (not stored on activity)
        items:
          $ref: '#/definitions/activities.ActivityGoalLink'
        type: array
      icon:
        description: Emoji
        type: string
      id:
        type: string
      last_used_at:
        type: string
      pinned:
        description: Display & Organization
        type: boolean
      quantity_default:
        type: number
      quantity_enabled:
        description: Quantity Settings
        type: boolean
      quantity_step:
        type: number
      quantity_unit_id:
        description: Fallback unit if no goal
        type: string
      sort_order:
        description: Order in quick bar
        type: integer
      title:
        description: Identity
        type: string
      updated_at:
        type: string
      use_count:
        description: Usage Statistics
        type: integer
    type: object
  activities.ActivityGoalLink:
    description: Link configuration for activity-goal relationship
    properties:
      auto_link_tasks:
        description: Auto-link tasks to this goal
        type: boolean
      default_impact:
        description: Override impact type
        type: string
      goal:
        allOf:
        - $ref: '#/definitions/goals.Goal'
        description: Populated goal details (for display)
      goal_id:
        type: string
      quantity_multiplier:
        description: Multiply quantity when linking
        type: number
    type: object
  activities.ActivityGoalLinkDetail:
    description: Goal linked to activity with full details
    properties:
      auto_link_tasks:
        type: boolean
      default_impact:
        type: string
      goal_color:
        type: string
      goal_icon:
        type: string
      goal_id:
        type: string
      goal_title:
        type: string
      quantity_multiplier:
        type: number
      target_unit_id:
        type: string
      target_unit_symbol:
        type: string
    type: object
  activities.ActivityPageResponse:
    description: Paginated list of activities
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/activities.Activity'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  activities.CreateRequest:
    description: Request payload for creating an activity
    properties:
      category_id:
        description: Category assignment
        example: categories:health
        type: string
      default_completed:
        example: true
        type: boolean
      default_duration:
        description: Task Defaults
        example: 1800
        type: integer
      default_emotion_id:
        example: emotions:E16
        type: string
      default_impact:
        description: Goal Link Defaults
        enum:
        - positive
        - negative
        - neutral
        example: positive
        type: string
      default_priority:
        example: 3
        maximum: 5
        minimum: 1
        type: integer
      description:
        example: Quick morning jog
        maxLength: 2000
        type: string
      goal_links:
        description: Goal linking
        items:
          $ref: '#/definitions/activities.GoalLinkInput'
        type: array
      icon:
        example: "\U0001F3C3"
        maxLength: 50
        type: string
      pinned:
        description: Display
        example: true
        type: boolean
      quantity_default:
        example: 1
        minimum: 0
        type: number
      quantity_enabled:
        description: Quantity Settings
        example: true
        type: boolean
      quantity_step:
        example: 0.5
        minimum: 0
        type: number
      quantity_unit_id:
        example: units:km
        type: string
      sort_order:
        example: 1
        type: integer
      title:
        example: Morning Run
        maxLength: 500
        minLength: 1
        type: string
    required:
    - title
    type: object
  activities.GoalLinkDefault:
    description: Pre-configured goal link
    properties:
      goal_icon:
        type: string
      goal_id:
        type: string
      goal_title:
        type: string
      impact_type:
        type: string
      quantity:
        type: number
      quantity_unit:
        type: string
    type: object
  activities.GoalLinkInput:
    description: Input for activity-goal link configuration
    properties:
      auto_link_tasks:
        example: true
        type: boolean
      default_impact:
        enum:
        - positive
        - negative
        - neutral
        example: positive
        type: string
      goal_id:
        example: goals:hydration
        type: string
      quantity_multiplier:
        example: 1
        minimum: 0
        type: number
    required:
    - goal_id
    type: object
  activities.GoalUpdateSummary:
    description: Goal progress update summary
    properties:
      goal_icon:
        type: string
      goal_id:
        type: string
      goal_title:
        type: string
      is_completed:
        type: boolean
      new_total:
        type: number
      target_value:
        type: number
      value_added:
        type: number
    type: object
  activities.InstantLogRequest:
    description: Request for instant task logging
    properties:
      notes:
        example: Felt great today
        type: string
      quantity:
        example: 2.5
        type: number
      timestamp:
        example: "2025-01-25T10:00:00Z"
        type: string
    type: object
  activities.InstantLogResponse:
    description: Response for instant logging
    properties:
      goals_updated:
        items:
          $ref: '#/definitions/activities.GoalUpdateSummary'
        type: array
      task_id:
        type: string
      task_title:
        type: string
    type: object
  activities.ScheduleRequest:
    description: Request for scheduling a task from activity
    properties:
      start_date:
        example: "2025-01-25T14:00:00Z"
        type: string
    type: object
  activities.ScheduleResponse:
    description: Response with pre-filled task defaults
    properties:
      activity:
        $ref: '#/definitions/activities.Activity'
      goal_links:
        items:
          $ref: '#/definitions/activities.GoalLinkDefault'
        type: array
      task_defaults:
        $ref: '#/definitions/activities.TaskDefaults'
    type: object
  activities.TaskDefaults:
    description: Pre-filled task form values
    properties:
      category_id:
        type: string
      duration:
        type: integer
      emotion_id:
        type: string
      journal:
        type: string
      priority:
        type: integer
      quantity:
        type: number
      quantity_unit:
        type: string
      title:
        type: string
    type: object
  activities.TimerBreak:
    description: Break period during timer session
    properties:
      duration:
        description: seconds
        type: integer
      ended_at:
        type: string
      started_at:
        type: string
    type: object
  activities.TimerSession:
    description: Active Flowmodoro timer session
    properties:
      breaks:
        items:
          $ref: '#/definitions/activities.TimerBreak'
        type: array
      started_at:
        type: string
      task_id:
        type: string
    type: object
  activities.UpdateRequest:
    description: Request payload for updating an activity
    properties:
      default_completed:
        type: boolean
      default_duration:
        type: integer
      default_emotion_id:
        type: string
      default_impact:
        enum:
        - positive
        - negative
        - neutral
        type: string
      default_priority:
        maximum: 5
        minimum: 1
        type: integer
      description:
        maxLength: 2000
        type: string
      icon:
        maxLength: 50
        type: string
      pinned:
        type: boolean
      quantity_default:
        minimum: 0
        type: number
      quantity_enabled:
        type: boolean
      quantity_step:
        minimum: 0
        type: number
      quantity_unit_id:
        type: string
      sort_order:
        type: integer
      title:
        maxLength: 500
        minLength: 1
        type: string
    type: object
  activitylogs.ActivityLog:
    description: Activity log entry for any entity
    properties:
      changes:
        additionalProperties: {}
        description: What changed
        type: object
      created_at:
        type: string
      created_by:
        description: Metadata
        type: string
      entity_icon:
        description: Icon of the entity for display
        type: string
      entity_id:
        description: The actual entity ID
        type: string
      entity_title:
        description: Display helpers (populated for frontend)
        type: string
      entity_type:
        description: Entity information
        type: string
      event:
        description: Event information
        type: string
      id:
        description: activity_logs:xxx
        type: string
    type: object
  activitylogs.ActivityLogsResponse:
    description: Activity log list response
    properties:
      logs:
        items:
          $ref: '#/definitions/activitylogs.ActivityLog'
        type: array
      total:
        type: integer
    type: object
  analytics.CategoryBreakdown:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      hours:
        type: number
      percentage:
        type: number
      task_count:
        type: integer
    type: object
  analytics.CategoryMetrics:
    description: Category time distribution metrics
    properties:
      distribution:
        items:
          $ref: '#/definitions/analytics.CategoryBreakdown'
        type: array
      life_domain_distribution:
        items:
          $ref: '#/definitions/analytics.LifeDomainBreakdown'
        type: array
      neglected_areas:
        items:
          $ref: '#/definitions/analytics.NeglectedCategory'
        type: array
      total_hours:
        type: number
    type: object
  analytics.ChartMeta:
    properties:
      computed_at:
        type: string
      data_points:
        type: integer
      end_date:
        type: string
      period:
        type: string
      start_date:
        type: string
    type: object
  analytics.ChartRequest:
    description: Generic request for generating chart data
    properties:
      chart_type:
        enum:
        - time_series
        - pie
        - bar
        - heatmap
        - radar
        - scatter
        - gauge
        example: time_series
        type: string
      end_date:
        example: "2025-12-14T23:59:59Z"
        type: string
      filters:
        $ref: '#/definitions/analytics.Filters'
      group_by:
        description: '"hour", "day", "week", "month", "category", "quadrant"'
        example: day
        type: string
      metric:
        example: mood
        type: string
      period:
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        example: week
        type: string
      start_date:
        example: "2025-12-01T00:00:00Z"
        type: string
    required:
    - chart_type
    - metric
    - period
    type: object
  analytics.ChartResponse:
    description: Generic chart data response
    properties:
      chart_type:
        type: string
      data:
        description: Shape varies by chart_type
      meta:
        $ref: '#/definitions/analytics.ChartMeta'
      metric:
        type: string
    type: object
  analytics.DailyMood:
    properties:
      arousal:
        type: number
      date:
        type: string
      quadrant:
        type: string
      valence:
        type: number
    type: object
  analytics.DashboardResponse:
    description: Combined dashboard metrics
    properties:
      categories:
        $ref: '#/definitions/analytics.CategoryMetrics'
      emotions:
        $ref: '#/definitions/analytics.EmotionMetrics'
      goals:
        $ref: '#/definitions/analytics.GoalMetrics'
      period:
        type: string
      tasks:
        $ref: '#/definitions/analytics.TaskMetrics'
    type: object
  analytics.EmotionCount:
    properties:
      count:
        type: integer
      emotion_id:
        type: string
      emotion_name:
        type: string
      quadrant:
        type: string
    type: object
  analytics.EmotionMetrics:
    description: Emotion and mood metrics with 6D vector analysis
    properties:
      average_arousal:
        description: -1 to +1
        type: number
      average_valence:
        description: -1 to +1
        type: number
      dominant_quadrant:
        description: yellow/green/red/blue
        type: string
      emotion_counts:
        additionalProperties:
          type: integer
        description: Emotion name -> count
        type: object
      mood_stability:
        description: 0 to 1 (1 = stable)
        type: number
      quadrant_distribution:
        $ref: '#/definitions/analytics.QuadrantDist'
      top_emotions:
        items:
          $ref: '#/definitions/analytics.EmotionCount'
        type: array
      trend:
        description: Daily mood over time
        items:
          $ref: '#/definitions/analytics.DailyMood'
        type: array
    type: object
  analytics.Filters:
    properties:
      category_ids:
        items:
          type: string
        type: array
      goal_ids:
        items:
          type: string
        type: array
      life_domain:
        items:
          type: string
        type: array
      quadrants:
        description: '"yellow", "green", "red", "blue"'
        items:
          type: string
        type: array
      task_status:
        items:
          type: string
        type: array
    type: object
  analytics.GoalMetrics:
    description: Goal and streak metrics
    properties:
      active_goals:
        type: integer
      avg_progress:
        description: Average % progress
        type: number
      completed_goals:
        type: integer
      goal_progress:
        items:
          $ref: '#/definitions/analytics.GoalProgress'
        type: array
      streak_leaders:
        description: Top streaks
        items:
          $ref: '#/definitions/analytics.StreakInfo'
        type: array
      total_streak_days:
        description: Sum of all current streaks
        type: integer
    type: object
  analytics.GoalProgress:
    properties:
      current_value:
        type: number
      goal_id:
        type: string
      goal_title:
        type: string
      goal_type:
        type: string
      progress:
        description: 0-100%
        type: number
      status:
        type: string
      target_value:
        type: number
    type: object
  analytics.LifeDomainBreakdown:
    properties:
      domain:
        type: string
      hours:
        type: number
      percentage:
        type: number
    type: object
  analytics.NeglectedCategory:
    properties:
      category_id:
        type: string
      category_name:
        type: string
      days_since_active:
        type: integer
    type: object
  analytics.QuadrantDist:
    properties:
      blue:
        description: Low energy, unpleasant
        type: number
      green:
        description: Low energy, pleasant
        type: number
      red:
        description: High energy, unpleasant
        type: number
      yellow:
        description: High energy, pleasant
        type: number
    type: object
  analytics.StreakInfo:
    properties:
      current_streak:
        type: integer
      goal_id:
        type: string
      goal_title:
        type: string
      longest_streak:
        type: integer
    type: object
  analytics.TaskMetrics:
    description: Task productivity metrics
    properties:
      abandoned_tasks:
        type: integer
      avg_task_duration_minutes:
        type: number
      by_category:
        items:
          $ref: '#/definitions/analytics.CategoryBreakdown'
        type: array
      completed_tasks:
        type: integer
      completion_rate:
        description: '% of tasks completed'
        type: number
      peak_hours:
        description: Most productive hours
        items:
          type: integer
        type: array
      postponed_tasks:
        type: integer
      total_duration_hours:
        type: number
      total_tasks:
        type: integer
      velocity:
        description: Tasks per day
        type: number
    type: object
  auth.AuthResponse:
    description: Authentication response with JWT token
    properties:
      is_admin:
        example: false
        type: boolean
      token:
        example: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        example: user:abc123
        type: string
    type: object
  auth.LoginRequest:
    description: Login request payload
    properties:
      password:
        example: adminadmin
        minLength: 6
        type: string
      username:
        example: admin@example.com
        minLength: 1
        type: string
    required:
    - password
    - username
    type: object
  auth.RegisterRequest:
    description: Registration request payload
    properties:
      password:
        example: password123
        minLength: 6
        type: string
      username:
        example: user@example.com
        type: string
    required:
    - password
    - username
    type: object
  categories.Category:
    properties:
      color:
        type: string
      created_at:
        type: string
      deleted_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  categories.CategoryPageResponse:
    properties:
      has_more:
        type: boolean
      items:
        items:
          $ref: '#/definitions/categories.Category'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  categories.CreateRequest:
    description: Request payload for creating a category
    properties:
      color:
        example: '#3B82F6'
        maxLength: 20
        minLength: 4
        type: string
      name:
        example: Work
        maxLength: 40
        minLength: 1
        type: string
    required:
    - color
    - name
    type: object
  categories.UpdateRequest:
    description: Request payload for updating a category
    properties:
      color:
        example: '#10B981'
        maxLength: 20
        minLength: 4
        type: string
      name:
        example: Personal
        maxLength: 40
        minLength: 1
        type: string
    type: object
  emotions.Emotion:
    properties:
      arousal:
        description: '-1 to +1: high/low energy'
        type: number
      certainty:
        description: '-1 to +1: sure/unsure'
        type: number
      description:
        type: string
      dominance:
        description: '-1 to +1: in control/controlled'
        type: number
      emoji:
        type: string
      id:
        description: e.g., "emotions:E16"
        type: string
      intensity:
        description: '0.1 to 1.0: default weight'
        type: number
      name:
        type: string
      quadrant:
        type: string
      social:
        description: '-1 to +1: social/individual'
        type: number
      valence:
        description: '-1 to +1: pleasant/unpleasant'
        type: number
      x:
        type: integer
      "y":
        type: integer
    type: object
  emotions.EmotionDetail:
    properties:
      arousal:
        type: number
      certainty:
        type: number
      description:
        type: string
      dominance:
        type: number
      emoji:
        type: string
      id:
        description: e.g., "emotions:E16"
        type: string
      intensity:
        type: number
      name:
        type: string
      quadrant:
        type: string
      social:
        type: number
      valence:
        type: number
      x:
        type: integer
      "y":
        type: integer
    type: object
  emotions.GridResponse:
    properties:
      blue:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
      green:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
      red:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
      total:
        type: integer
      yellow:
        items:
          $ref: '#/definitions/emotions.Emotion'
        type: array
    type: object
  emotions.InferRequest:
    properties:
      negatives:
        items:
          $ref: '#/definitions/emotions.TaskItem'
        type: array
      positives:
        items:
          $ref: '#/definitions/emotions.TaskItem'
        type: array
    type: object
  emotions.InferResponse:
    properties:
      closest_emotion:
        $ref: '#/definitions/emotions.EmotionDetail'
      inferred_emotion:
        $ref: '#/definitions/emotions.InferredEmotion'
    type: object
  emotions.InferredEmotion:
    properties:
      arousal:
        description: -1 to +1
        type: number
      closest_emotion_id:
        description: Nearest emotion
        type: string
      dissonance:
        description: '0-1: internal conflict score'
        type: number
      dominance:
        description: -1 to +1
        type: number
      negative_count:
        description: Number of negative items with emotions
        type: integer
      positive_count:
        description: Metadata
        type: integer
      quadrant:
        description: Classification
        type: string
      valence:
        description: Weighted centroid coordinates
        type: number
    type: object
  emotions.TaskItem:
    properties:
      emotion_id:
        description: 'Optional: e.g., "emotions:E16"'
        type: string
      text:
        type: string
    type: object
  errors.ErrorCode:
    enum:
    - BAD_REQUEST
    - VALIDATION_FAILED
    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - CONFLICT
    - TOO_MANY_REQUESTS
    - INTERNAL_ERROR
    - DATABASE_ERROR
    - SERVICE_UNAVAILABLE
    type: string
    x-enum-varnames:
    - CodeBadRequest
    - CodeValidationFailed
    - CodeUnauthorized
    - CodeForbidden
    - CodeNotFound
    - CodeConflict
    - CodeTooManyRequests
    - CodeInternalError
    - CodeDatabaseError
    - CodeServiceError
  goallogs.GoalLog:
    description: Goal history event record
    properties:
      changes:
        additionalProperties: {}
        description: What changed (optional, depends on event type)
        type: object
      created_at:
        description: Metadata
        type: string
      event:
        description: Event type
        type: string
      goal_id:
        description: goals:xxx
        type: string
      id:
        description: goal_logs:xxx
        type: string
      progress_after:
        type: number
      progress_before:
        description: Progress at time of event
        type: number
      snapshot_id:
        description: Snapshot reference
        type: string
      triggered_by_task_id:
        description: What triggered this event (optional)
        type: string
      triggering_task:
        allOf:
        - $ref: '#/definitions/goallogs.TriggeringTaskInfo'
        description: Triggering task details (populated on read for task-related events)
      value_contributed:
        description: Value contributed (for task_linked events)
        type: number
      value_unit:
        type: string
    type: object
  goallogs.GoalLogsResponse:
    description: Goal history log entries
    properties:
      goal_id:
        type: string
      logs:
        items:
          $ref: '#/definitions/goallogs.GoalLog'
        type: array
      total:
        type: integer
    type: object
  goallogs.GoalLogsSummary:
    description: Summary of goal history
    properties:
      avg_daily:
        type: number
      best_day:
        properties:
          date:
            type: string
          value:
            type: number
        type: object
      days_met:
        type: integer
      days_missed:
        type: integer
    type: object
  goallogs.TriggeringTaskInfo:
    description: Task info that triggered a goal event
    properties:
      category:
        properties:
          color:
            type: string
          id:
            type: string
          name:
            type: string
        type: object
      completed:
        type: boolean
      emotion_id:
        type: string
      end_date:
        type: string
      id:
        type: string
      start_date:
        type: string
      title:
        type: string
    type: object
  goals.AddChildRequest:
    description: Request for adding a child to a grouped goal
    properties:
      child_goal_id:
        example: goals:design_ui
        type: string
      order:
        example: 1
        type: integer
      required:
        example: true
        type: boolean
    required:
    - child_goal_id
    type: object
  goals.CreateRequest:
    description: Request payload for creating a goal
    properties:
      category_id:
        example: categories:health123
