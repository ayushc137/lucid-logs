# =============================================================================
# golangci-lint configuration
# =============================================================================
# Run with: make lint
# Install: go install github.com/golangci-lint/golangci-lint/cmd/golangci-lint@latest

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

# =============================================================================
# LINTERS
# =============================================================================

linters:
  enable:
    # Default linters
    - errcheck       # Check unchecked errors
    - gosimple       # Simplify code
    - govet          # Vet examines source code
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Static analysis
    - unused         # Check for unused code
    
    # Additional linters
    - gofmt          # Check code formatting
    - goimports      # Check import formatting
    - misspell       # Find misspelled words
    - unconvert      # Remove unnecessary type conversions
    - bodyclose      # Check HTTP response body is closed
    - noctx          # Check context propagation
    - gosec          # Security checks
    - prealloc       # Suggest slice preallocation
    - exportloopref  # Check loop variable captures
    - gocritic       # Comprehensive Go linter
    - errorlint      # Find code that will cause problems with errors

  disable:
    - deadcode       # Deprecated
    - structcheck    # Deprecated
    - varcheck       # Deprecated

# =============================================================================
# LINTER SETTINGS
# =============================================================================

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (io.Closer).Close
      - (net/http.ResponseWriter).Write

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Too strict for practical use

  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/daily-journal/go-backend

  misspell:
    locale: US

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104  # Unhandled errors (handled by errcheck)
      - G304  # File path from variable (often intentional)

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam      # Too strict
      - rangeValCopy   # Often intentional

  errorlint:
    errorf: true
    asserts: true
    comparison: true

# =============================================================================
# ISSUES
# =============================================================================

issues:
  exclude-rules:
    # Ignore long lines in generated files
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - gocritic

    # Allow dot imports in tests
    - path: _test\.go
      text: "should not use dot imports"

    # Allow unused params in interface implementations
    - linters:
        - unused
      text: "unused-parameter"

  max-issues-per-linter: 50
  max-same-issues: 10
  new: false
