# Cargo configuration for rust_backend

[build]
# Use all available CPU cores
jobs = -1

[target.x86_64-unknown-linux-gnu]
# Use mold linker if available (faster linking)
# Uncomment if mold is installed: rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# Development shortcuts
dev = "watch -x run"
t = "nextest run"
lint = "clippy --all-targets --all-features -- -D warnings"
fmt-check = "fmt --all -- --check"
audit = "audit"
deny = "deny check"

[env]
# Default environment variables for development
RUST_BACKTRACE = { value = "1", force = false }

# Clippy configuration via RUSTFLAGS
[target.'cfg(all())']
rustflags = [
    # Deny common issues
    "-Dclippy::all",
    "-Wclippy::pedantic",
    "-Wclippy::nursery",
    
    # Allow some pedantic lints
    "-Aclippy::module_name_repetitions",
    "-Aclippy::must_use_candidate",
    "-Aclippy::missing_errors_doc",
    "-Aclippy::missing_panics_doc",
    
    # Security lints
    "-Dclippy::unwrap_used",
    "-Wclippy::expect_used",
    
    # Performance hints
    "-Wclippy::inefficient_to_string",
    "-Wclippy::large_futures",
]

