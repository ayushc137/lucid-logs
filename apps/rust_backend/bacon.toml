# =============================================================================
# Bacon Configuration
# =============================================================================
# Bacon is a background Rust code checker.
# Install: cargo install bacon
# Run: bacon (or just "bacon" from this directory)
#
# Keybindings (while bacon is running):
#   c - switch to clippy job
#   t - switch to test job
#   d - switch to doc job
#   r - switch to run job
#   w - toggle wrapping
#   s - toggle summary
#   q - quit
# =============================================================================

# Default job when you just run "bacon"
default_job = "clippy"

# Summary style: "none", "count", or "ratio"
summary = "count"

# Wrap long lines
wrap = true

# Reverse output (newest at bottom)
reverse = false

# Show help on start
help_line = true

# =============================================================================
# Jobs
# =============================================================================

[jobs.check]
command = ["cargo", "check", "--all-targets", "--color", "always"]
need_stdout = false
watch = ["src", "tests", "benches", "Cargo.toml"]

[jobs.clippy]
command = [
    "cargo", "clippy",
    "--all-targets",
    "--all-features",
    "--color", "always",
]
need_stdout = false
watch = ["src", "tests", "benches", "Cargo.toml"]

[jobs.test]
command = [
    "cargo", "test",
    "--color", "always",
    "--",
    "--color", "always",  # for test output too
]
need_stdout = true
watch = ["src", "tests", "Cargo.toml"]

[jobs.test-nextest]
command = [
    "cargo", "nextest", "run",
    "--color", "always",
]
need_stdout = true
watch = ["src", "tests", "Cargo.toml"]

[jobs.doc]
command = ["cargo", "doc", "--no-deps", "--color", "always"]
need_stdout = false
watch = ["src"]

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
watch = ["src", "Cargo.toml"]
background = true
# Kill previous run before starting new one
on_change_strategy = "kill_then_restart"

[jobs.fmt]
command = ["cargo", "fmt", "--all", "--", "--check"]
need_stdout = true
watch = ["src", "tests"]

# =============================================================================
# Custom Jobs for This Project
# =============================================================================

[jobs.check-all]
command = [
    "cargo", "check",
    "--all-targets",
    "--all-features",
    "--color", "always",
]
need_stdout = false
watch = ["src", "tests", "benches", "Cargo.toml"]

[jobs.lint]
command = [
    "sh", "-c",
    "cargo clippy --all-targets --all-features --color always -- -D warnings && cargo fmt --all -- --check"
]
need_stdout = true
watch = ["src", "tests", "Cargo.toml", "rustfmt.toml"]

# Focused test - runs only tests matching a pattern
# Usage: bacon test-focus -- test_name
[jobs.test-focus]
command = ["cargo", "test", "--color", "always"]
need_stdout = true
watch = ["src", "tests"]

# =============================================================================
# Keybindings
# =============================================================================

[keybindings]
# Standard jobs
c = "job:clippy"
t = "job:test"
d = "job:doc"
r = "job:run"
f = "job:fmt"

# Custom jobs
l = "job:lint"
n = "job:test-nextest"
a = "job:check-all"

# Navigation
esc = "back"
q = "quit"
h = "help"

# Display
w = "toggle-wrap"
s = "toggle-summary"

