[template]
cargo_generate_version = ">=0.10.0"

[placeholders.feature_name]
type = "string"
prompt = "Feature name (e.g., 'comment', 'tag', 'journal')?"
regex = "^[a-z][a-z0-9_]*$"

[placeholders.feature_name_pascal]
type = "string"
prompt = "Feature name in PascalCase (e.g., 'Comment', 'Tag', 'Journal')?"
regex = "^[A-Z][a-zA-Z0-9]*$"

[placeholders.table_name]
type = "string"
prompt = "Database table name (e.g., 'comments', 'tags', 'journals')?"
regex = "^[a-z][a-z0-9_]*$"

