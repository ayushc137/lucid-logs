[package]
name = "rust_backend"
version = "0.1.0"
edition = "2021"
description = "Daily Journal Backend API - Rust/Axum implementation"
default-run = "rust_backend"

[lib]
name = "rust_backend"
path = "src/lib.rs"

[[bin]]
name = "rust_backend"
path = "src/main.rs"

[[bin]]
name = "schema"
path = "src/bin/schema.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
surrealdb = { version = "2", features = ["protocol-ws", "protocol-http"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# JWT/Auth
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Environment
dotenvy = "0.15"

# File watching (for schema hot-reload in dev)
notify = "8"

# Cryptographically secure random generation
rand = "0.9"
base64ct = { version = "1.8", features = ["std"] }

# Hashing for migration checksums
sha2 = "0.10"

# OpenAPI documentation
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

# === New dependencies for improved DX ===

# Async trait support (required for service traits)
async-trait = "0.1"

# CLI parsing for schema binary
clap = { version = "4", features = ["derive"] }

# Reduce derive boilerplate
derive_more = { version = "1", features = ["display", "from", "into", "error"] }

# Enum utilities
strum = { version = "0.26", features = ["derive"] }

# Builder patterns
bon = "3"
typed-builder = "0.20"

# Faster synchronization primitives
parking_lot = "0.12"

# Concurrent hashmap
dashmap = "6"

# Lazy statics (for global state)
once_cell = "1"

[dev-dependencies]
# Faster test runner (document in README: cargo install cargo-nextest)
# Note: cargo-nextest is installed as a cargo tool, not a lib dependency

# Snapshot testing
insta = { version = "1", features = ["json", "redactions"] }

# Fake data generation
fake = { version = "3", features = ["derive", "chrono"] }

# HTTP mocking
wiremock = "0.6"

# Test log capture
tracing-test = "0.2"

# Parameterized tests
rstest = "0.23"

# Readable test diffs
pretty_assertions = "1"

# Auto mock generation
mockall = "0.13"

# Test case macros
test-case = "3"

# Async test utilities
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
# Faster dev builds
opt-level = 0
debug = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
# Allow some pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
