version: '3'

dotenv: [".env"]

env:
  PATH: "{{.HOME}}/.cargo/bin:{{.HOME}}/go/bin:{{.PATH}}"

vars:
  GO_BACKEND: apps/go_backend
  RUST_BACKEND: apps/rust_backend

tasks:
  # =============================================================================
  # MAIN COMMANDS
  # =============================================================================
  
  default:
    desc: Show available commands
    cmds:
      - task --list

  setup:
    desc: One-time project setup (install all tools)
    cmds:
      - cp -n env.example .env 2>/dev/null || true
      - task: setup:go
      - task: setup:rust
      - echo ""
      - echo "✅ Setup complete! Run 'task dev:go' or 'task dev:rust' to start"

  # =============================================================================
  # GO BACKEND
  # =============================================================================

  setup:go:
    desc: Install Go development tools
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go mod download
      - go install github.com/air-verse/air@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install mvdan.cc/gofumpt@latest
      - echo "✅ Go tools installed"

  dev:go:
    desc: Start Go backend (hot reload + lint + format on save)
    dir: "{{.GO_BACKEND}}"
    deps: [db:up]
    cmds:
      - air

  build:go:
    desc: Build Go backend
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go build -o build/api ./cmd/api

  test:go:
    desc: Run Go tests
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go test -v -race ./...

  lint:go:
    desc: Lint and format Go code
    dir: "{{.GO_BACKEND}}"
    cmds:
      - gofumpt -l -w .
      - golangci-lint run ./...

  new:go:
    desc: Create new Go feature (usage - task new:go -- comments)
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go run cmd/gen/main.go {{.CLI_ARGS}}

  # =============================================================================
  # RUST BACKEND
  # =============================================================================

  setup:rust:
    desc: Install Rust development tools
    cmds:
      - cargo install cargo-watch cargo-nextest 2>/dev/null || true
      - echo "✅ Rust tools installed"

  dev:rust:
    desc: Start Rust backend (hot reload + checks on save)
    dir: "{{.RUST_BACKEND}}"
    deps: [db:up]
    cmds:
      - cargo watch -x run

  build:rust:
    desc: Build Rust backend
    dir: "{{.RUST_BACKEND}}"
    cmds:
      - cargo build --release

  test:rust:
    desc: Run Rust tests
    dir: "{{.RUST_BACKEND}}"
    cmds:
      - cargo nextest run 2>/dev/null || cargo test

  lint:rust:
    desc: Lint and format Rust code
    dir: "{{.RUST_BACKEND}}"
    cmds:
      - cargo fmt --all
      - cargo clippy --all-targets -- -D warnings

  migrate:rust:
    desc: Run database migrations
    dir: "{{.RUST_BACKEND}}"
    deps: [db:up]
    cmds:
      - cargo run --bin schema -- migrate

  # =============================================================================
  # DATABASE
  # =============================================================================

  db:up:
    desc: Start SurrealDB
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d surrealdb
      - sleep 2

  db:down:
    desc: Stop SurrealDB
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  db:reset:
    desc: Reset database (DESTRUCTIVE!)
    cmds:
      - docker compose -f deploy/docker-compose.yml down -v
      - docker compose -f deploy/docker-compose.yml up -d surrealdb
      - sleep 2
      - echo "✅ Database reset"

  # =============================================================================
  # SHORTCUTS
  # =============================================================================

  go:
    desc: Alias for dev:go
    cmds:
      - task: dev:go

  rust:
    desc: Alias for dev:rust
    cmds:
      - task: dev:rust

  test:
    desc: Run all tests
    cmds:
      - task: test:go
      - task: test:rust

  lint:
    desc: Lint all code
    cmds:
      - task: lint:go
      - task: lint:rust
