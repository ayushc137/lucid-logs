version: '3'

dotenv: [".env"]

env:
  PATH: "{{.HOME}}/.cargo/bin:{{.HOME}}/go/bin:{{.PATH}}"

vars:
  GO_BACKEND: apps/go_backend
  RUST_BACKEND: apps/rust_backend
  FRONTEND: apps/frontend

tasks:
  # =============================================================================
  # MAIN COMMANDS
  # =============================================================================
  
  default:
    desc: Show available commands
    cmds:
      - task --list

  setup:
    desc: One-time project setup (install all tools)
    cmds:
      - cp -n env.example .env 2>/dev/null || true
      - task: setup:go
      - task: setup:rust
      - task: setup:fe
      - echo ""
      - echo "✅ Setup complete! Run 'task dev' for full-stack or 'task go' / 'task fe'"

  dev:
    desc: Start full-stack development (Go backend + SvelteKit frontend)
    deps: [db:up]
    cmds:
      - |
        echo "🚀 Starting Go backend on :8080 and Frontend on :5173"
        # Start backend first
        (cd {{.GO_BACKEND}} && lsof -ti :8080 | xargs kill -9 2>/dev/null || true && air) &
        BACKEND_PID=$!
        # Wait for backend to be ready (check health endpoint)
        echo "⏳ Waiting for backend to start..."
        for i in {1..30}; do
          if curl -s http://localhost:8080/health/ > /dev/null 2>&1; then
            echo "✅ Backend is ready!"
            break
          fi
          sleep 0.5
        done
        # Start frontend
        (cd {{.FRONTEND}} && pnpm dev --host) &
        wait

  # =============================================================================
  # GO BACKEND
  # =============================================================================

  setup:go:
    desc: Install Go development tools
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go mod download
      - go install github.com/air-verse/air@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install mvdan.cc/gofumpt@latest
      - echo "✅ Go tools installed"

  dev:go:
    desc: Start Go backend (hot reload + lint + format on save)
    dir: "{{.GO_BACKEND}}"
    deps: [db:schema]
    cmds:
      - lsof -ti :8080 | xargs kill -9 2>/dev/null || true
      - echo "✅ Port 8080 cleared"
      - air

  build:go:
    desc: Build Go backend
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go build -o build/api ./cmd/api

  test:go:
    desc: Run Go tests
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go test -v -race ./...

  lint:go:
    desc: Lint and format Go code
    dir: "{{.GO_BACKEND}}"
    cmds:
      - gofumpt -l -w .
      - golangci-lint run ./...

  docs:go:
    desc: Regenerate Go Swagger docs from annotations
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go generate ./cmd/api

  new:go:
    desc: Create new Go feature (usage - task new:go -- comments)
    dir: "{{.GO_BACKEND}}"
    cmds:
      - go run cmd/gen/main.go {{.CLI_ARGS}}

  seed:
    desc: Populate database with test data (tasks for yesterday, today, tomorrow)
    dir: "{{.GO_BACKEND}}"
    deps: [db:schema]
    cmds:
      - go run ./cmd/seed

  seed:reset:
    desc: Reset and repopulate seed data (deletes existing seeded data first)
    dir: "{{.GO_BACKEND}}"
    deps: [db:schema]
    cmds:
      - go run ./cmd/seed --reset

  # =============================================================================
  # SVELTEKIT FRONTEND
  # =============================================================================

  setup:fe:
    desc: Install frontend dependencies with pnpm
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm install
      - echo "✅ Frontend dependencies installed"

  dev:fe:
    desc: Start SvelteKit frontend (hot reload)
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm dev --host

  build:fe:
    desc: Build frontend for production
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm build

  check:fe:
    desc: Type check frontend code
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm check

  lint:fe:
    desc: Lint and format frontend code (Biome)
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm lint:fix
      - pnpm format

  preview:fe:
    desc: Preview production build locally
    dir: "{{.FRONTEND}}"
    cmds:
      - pnpm preview --host

  # =============================================================================
  # RUST BACKEND
  # =============================================================================

  setup:rust:
    desc: Install Rust development tools
    cmds:
      - cargo install cargo-watch cargo-nextest 2>/dev/null || true
      - echo "✅ Rust tools installed"

  dev:rust:
    desc: Start Rust backend (hot reload + checks on save)
    dir: "{{.RUST_BACKEND}}"
    deps: [db:up]
    cmds:
      - cargo watch -x run

  build:rust:
    desc: Build Rust backend
    dir: "{{.RUST_BACKEND}}"
    cmds:
      - cargo build --release

  test:rust:
    desc: Run Rust tests
    dir: "{{.RUST_BACKEND}}"
    cmds:
      - cargo nextest run 2>/dev/null || cargo test

  lint:rust:
    desc: Lint and format Rust code
    dir: "{{.RUST_BACKEND}}"
    cmds:
      - cargo fmt --all
      - cargo clippy --all-targets -- -D warnings

  migrate:rust:
    desc: Run database migrations
    dir: "{{.RUST_BACKEND}}"
    deps: [db:up]
    cmds:
      - cargo run --bin schema -- migrate

  # =============================================================================
  # DATABASE
  # =============================================================================

  db:up:
    desc: Start SurrealDB
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d surrealdb
      - sleep 2

  db:schema:
    desc: Apply database schema and seed emotions (SurrealDB v3 requires tables to exist)
    deps: [db:up]
    cmds:
      - |
        curl -sf -X POST http://localhost:${DB_PORT}/sql \
          -H "surreal-ns: ${DB_NAMESPACE}" \
          -H "surreal-db: ${DB_DATABASE}" \
          -H "Accept: application/json" \
          -u "${DB_USER}:${DB_PASS}" \
          --data-binary @db/schema.surql > /dev/null
      - |
        curl -sf -X POST http://localhost:${DB_PORT}/sql \
          -H "surreal-ns: ${DB_NAMESPACE}" \
          -H "surreal-db: ${DB_DATABASE}" \
          -H "Accept: application/json" \
          -u "${DB_USER}:${DB_PASS}" \
          --data-binary @db/migrations/002_seed_emotions.surql > /dev/null
      - echo "✅ Schema applied"

  db:down:
    desc: Stop SurrealDB
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  db:reset:
    desc: Reset database (DESTRUCTIVE!)
    cmds:
      - docker compose -f deploy/docker-compose.yml down -v
      - docker compose -f deploy/docker-compose.yml up -d surrealdb
      - sleep 2
      - task: db:schema
      - echo "✅ Database reset"

  # =============================================================================
  # SHORTCUTS
  # =============================================================================

  go:
    desc: Alias for dev:go
    cmds:
      - task: dev:go

  fe:
    desc: Alias for dev:fe
    cmds:
      - task: dev:fe

  rust:
    desc: Alias for dev:rust
    cmds:
      - task: dev:rust

  test:
    desc: Run all tests
    cmds:
      - task: test:go
      - task: test:rust

  lint:
    desc: Lint all code
    cmds:
      - task: lint:go
      - task: lint:fe
      - task: lint:rust

  build:
    desc: Build all apps
    cmds:
      - task: build:go
      - task: build:fe
      - task: build:rust

  check:
    desc: Type check all code
    cmds:
      - task: check:fe

