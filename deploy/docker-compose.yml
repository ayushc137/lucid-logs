# Lucid Logs — all-in-one Docker Compose
# ========================================
# A single container: SvelteKit SPA + Go API + embedded libSQL (SQLite).
# No external database, no reverse proxy needed.
#
#   cp .env.example .env        # then edit values
#   docker compose up -d
#
# The app is then reachable on http://localhost:8080 (or your host/domain).

services:
  lucid-logs:
    build:
      context: ..          # repo root — the all-in-one Dockerfile lives there
      dockerfile: Dockerfile
    image: lucid-logs:latest
    container_name: lucid-logs
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: production
      # REQUIRED: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      # First-run admin account (created only if no users exist yet).
      ADMIN_SEED: ${ADMIN_SEED:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional: pre-fill the AI settings screen (bring-your-own-key).
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - lucid-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  lucid-data:
