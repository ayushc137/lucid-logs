version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount the workspace
      - ..:/workspace:cached
      # Persist bash history
      - devcontainer-bashhistory:/commandhistory
    # Keep container running
    command: sleep infinity
    # Network to communicate with SurrealDB
    networks:
      - dev-network
    environment:
      # Database connection (uses service name)
      - DB_HOST=surrealdb
      - DB_PORT=8000
      - DB_USER=root
      - DB_PASS=root
      - DB_NAMESPACE=daily_journal
      - DB_DATABASE=core
      # Development settings
      - APP_ENV=development
      - HTTP_PORT=8080
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    depends_on:
      - surrealdb

  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --log trace --user root --pass root file:/data/database.db
    volumes:
      - surrealdb-data:/data
    networks:
      - dev-network
    ports:
      - "8000:8000"

networks:
  dev-network:
    driver: bridge

volumes:
  devcontainer-bashhistory:
  devcontainer-cargo-cache:
  devcontainer-rustup-cache:
  surrealdb-data:

